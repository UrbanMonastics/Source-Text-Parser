language: php

matrix:
  include:
    - php: 8.1
      dist: bionic
    - php: 8.2
      dist: bionic
    - php: 8.3
      dist: bionic
    - php: 8.4
      dist: bionic

install:
  - composer install --prefer-dist --no-interaction --no-progress

script:
  - vendor/bin/phpunit --version
  - vendor/bin/phpunit test || true
  # - vendor/bin/phpunit test/CommonMarkTestWeak.php || true
